<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos — Odêncio Maculuve</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height: 100%; }

  body {
    background:#111214;
    font-family:'Poppins',sans-serif;
    min-height: 100dvh;
  }

  .card {
    width: 100%;
    min-height: 100dvh;
    background:#111214;
    padding: clamp(20px, 4vw, 55px) clamp(20px, 6vw, 70px);
    display:flex;
    flex-direction:column;
    position: relative;
  }

  /* Top bar */
  .header {
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    z-index:3;
    padding-bottom: clamp(24px, 4vh, 40px);
  }

  .logo {
    font-weight:700;
    letter-spacing:2px;
    font-size: clamp(13px, 1.4vw, 15px);
    color:#f2f2f2;
  }

  .logo-wrap { display:flex; align-items:center; gap:12px; text-decoration:none; }

  .avatar {
    display:none;
    width:36px; height:36px; border-radius:50%;
    object-fit:cover; object-position: center top;
    filter: grayscale(100%) contrast(1.05);
    border:1px solid #3a3b40;
  }

  .top-menu { display:flex; align-items:flex-start; }

  /* Hamburger menu */
  .menu-wrap { position: relative; display:flex; align-items:center; }

  .menu-toggle {
    display:flex; flex-direction:column; justify-content:center;
    gap:5px; width:22px; height:16px; background:none; border:none;
    cursor:pointer; padding:0;
  }

  .menu-toggle span {
    display:block; height:2px; width:100%; background:#cfd0d2;
    transition: transform .25s ease, opacity .2s ease, background .2s ease;
  }

  .menu-toggle:hover span { background:#ffffff; }

  .menu-wrap.open .menu-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .menu-wrap.open .menu-toggle span:nth-child(2) { opacity:0; }
  .menu-wrap.open .menu-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .menu-dropdown {
    position:absolute; top: calc(100% + 18px); right:0;
    background:#17181b; border:1px solid #2a2b2f; border-radius:6px;
    padding: 10px 0; min-width:170px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
    z-index: 50;
  }

  .menu-wrap.open .menu-dropdown { opacity:1; visibility:visible; transform: translateY(0); }

  .menu-dropdown a {
    display:block; padding: 10px 22px; font-size:13px; letter-spacing:0.5px;
    color:#c7c8ca; text-decoration:none; font-weight:500;
    transition: background .15s ease, color .15s ease;
  }

  .menu-dropdown a:hover { background:#232428; color:#ffffff; }
  .menu-dropdown a.active { color:#ffffff; background:#1e1f23; }

  /* Content */
  .content { flex:1; }

  .eyebrow {
    font-size:11px;
    letter-spacing:2px;
    color:#8b8c91;
    font-weight:600;
    margin-bottom: 10px;
  }

  .hello {
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size: clamp(34px, 5vw, 58px);
    color:#f5f5f5;
    line-height:1.05;
    margin-bottom: clamp(10px, 2vh, 16px);
  }

  .desc {
    font-size: clamp(12.5px, 1vw, 15px);
    line-height:1.8;
    color:#9fa0a4;
    max-width: 560px;
    font-weight:400;
    margin-bottom: clamp(32px, 5vh, 48px);
  }

  /* Grid de projetos */
  .projects-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: clamp(16px, 2vw, 26px);
  }

  .project-card {
    background:#17181b;
    border:1px solid #2a2b2f;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition: border-color .2s ease, transform .2s ease;
  }

  .project-card:hover { border-color:#3a3b40; transform: translateY(-3px); }

  .project-cover {
    width:100%;
    aspect-ratio: 16/10;
    background:#1c1d20;
    overflow:hidden;
  }

  .project-cover img {
    width:100%; height:100%;
    object-fit:cover;
    filter: grayscale(60%) contrast(1.05);
  }

  .project-body { padding: 18px 20px 20px; display:flex; flex-direction:column; gap:8px; flex:1; }

  .project-title { font-size:16px; font-weight:700; color:#f2f2f2; }

  .project-desc {
    font-size:12.5px;
    line-height:1.7;
    color:#9fa0a4;
    flex:1;
  }

  .project-gallery {
    display:flex;
    gap:6px;
    margin-top:4px;
    flex-wrap:wrap;
  }

  .project-gallery img {
    width:44px; height:44px;
    object-fit:cover;
    border-radius:4px;
    filter: grayscale(60%);
    border:1px solid #2a2b2f;
    cursor:pointer;
  }

  .project-links {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }

  .project-links a {
    font-size:11.5px;
    color:#c7c8ca;
    background:#1e1f23;
    border:1px solid #2a2b2f;
    padding:6px 12px;
    border-radius:20px;
    text-decoration:none;
    font-weight:500;
    transition: background .2s ease, color .2s ease;
  }

  .project-links a:hover { background:#26272b; color:#ffffff; }

  .empty-state {
    color:#6f7075;
    font-size:13px;
    padding: 30px 0;
  }

  /* Footer */
  .footer {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-top: clamp(30px, 5vh, 48px);
    padding-bottom: clamp(4px, 1vh, 10px);
    z-index:2;
  }

  .footer-label {
    font-size:10px;
    letter-spacing:0.5px;
    color:#8b8c91;
    margin-bottom: 14px;
    font-weight:500;
  }

  .footer-icons { display:flex; gap:20px; color:#cfd0d2; font-size:17px; margin-bottom: 14px; }
  .footer-icons a { color:#cfd0d2; opacity:0.85; text-decoration:none; transition: opacity .2s, color .2s; }
  .footer-icons a:hover { opacity:1; color:#ffffff; }

  .footer-year { font-size:11px; letter-spacing:1px; color:#5f6065; font-weight:400; }

  @media (max-width: 760px) {
    .card { padding: 24px 24px; }
    .menu-dropdown { right:0; left:auto; }
    .avatar { display:block; }
    .projects-grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 1400px) {
    .card { padding-left: 6vw; padding-right: 6vw; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="top-menu">
        <div class="menu-wrap" id="menuWrap">
          <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <nav class="menu-dropdown" id="menuDropdown">
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre mim</a>
            <a href="contactos.html">Contactos</a>
            <a href="publicacoes.html">Publicações</a>
            <a href="projetos.html" class="active">Projetos</a>
            <a href="feedback.html">Feedback</a>
          </nav>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="eyebrow">PROJETOS</div>
      <h1 class="hello">O que tenho construído</h1>
      <p class="desc">Uma seleção dos projetos e iniciativas em que estou envolvido, da ROYALTY às demais frentes da Maculuve Investment.</p>

      <div class="projects-grid" id="projectsGrid">
        <div class="empty-state">A carregar projetos…</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-label">Contactar-me através de:</div>
      <div class="footer-icons" id="footerIcons">
        <a href="https://www.tiktok.com/@odenciofilomenabu?_r=1&_t=ZS-98dtDX3Fg8a" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://www.facebook.com/share/1DaBPRNUiL/" target="_blank" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.instagram.com/odenciofilomenabuqu?igsh=Nmowb2IyNWk4aXpl" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://wa.me/qr/DJSC2R2MUJ5AF1" target="_blank" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="mailto:odencmaculuve@gmail.com" title="E-mail"><i class="fa-solid fa-envelope"></i></a>
      </div>
      <div class="footer-year" id="footerYear"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const menuWrap = document.getElementById('menuWrap');
    const menuToggle = document.getElementById('menuToggle');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menuWrap.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', (e) => {
      if (!menuWrap.contains(e.target)) {
        menuWrap.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.getElementById('footerYear').textContent = '© ' + new Date().getFullYear();

    // ---------- Ícones do rodapé, dinâmicos a partir do Supabase ----------
    const ICONES = {
      whatsapp: 'fa-brands fa-whatsapp',
      instagram: 'fa-brands fa-instagram',
      tiktok: 'fa-brands fa-tiktok',
      facebook: 'fa-brands fa-facebook',
      email: 'fa-solid fa-envelope'
    };
    const NOMES = {
      whatsapp: 'WhatsApp',
      instagram: 'Instagram',
      tiktok: 'TikTok',
      facebook: 'Facebook',
      email: 'E-mail'
    };

    async function carregarFooterIcons() {
      try {
        const { data, error } = await window.supabaseClient
          .from('contactos')
          .select('plataforma, valor, ordem')
          .eq('ativo', true)
          .order('ordem', { ascending: true });

        if (error) throw error;
        if (data && data.length > 0) {
          const wrap = document.getElementById('footerIcons');
          wrap.innerHTML = data.map(c => {
            const icone = ICONES[c.plataforma] || 'fa-solid fa-link';
            const nome = NOMES[c.plataforma] || c.plataforma;
            const href = c.plataforma === 'email' ? ('mailto:' + c.valor) : c.valor;
            return `<a href="${href}" target="_blank" title="${nome}"><i class="${icone}"></i></a>`;
          }).join('');
        }
      } catch (err) {
        console.warn('Não foi possível carregar contactos do Supabase, a mostrar ícones padrão.', err);
      }
    }
    carregarFooterIcons();

    // ---------- Projetos ----------
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function carregarProjetos() {
      const grid = document.getElementById('projectsGrid');
      try {
        const { data, error } = await window.supabaseClient
          .from('projetos')
          .select('id, titulo, descricao, imagem_capa, imagens, links, ordem')
          .eq('publicado', true)
          .order('ordem', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = '<div class="empty-state">Ainda não há projetos publicados. Volte em breve.</div>';
          return;
        }

        grid.innerHTML = data.map(p => {
          const capa = p.imagem_capa
            ? `<div class="project-cover"><img src="${escapeHtml(p.imagem_capa)}" alt="${escapeHtml(p.titulo)}"></div>`
            : '';

          const imagensExtra = Array.isArray(p.imagens) && p.imagens.length > 0
            ? `<div class="project-gallery">${p.imagens.map(url =>
                `<img src="${escapeHtml(url)}" alt="${escapeHtml(p.titulo)}" onclick="window.open('${url}', '_blank')">`
              ).join('')}</div>`
            : '';

          const links = Array.isArray(p.links) && p.links.length > 0
            ? `<div class="project-links">${p.links.map(l =>
                `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.nome || 'Ver mais')}</a>`
              ).join('')}</div>`
            : '';

          return `
            <div class="project-card">
              ${capa}
              <div class="project-body">
                <div class="project-title">${escapeHtml(p.titulo)}</div>
                <div class="project-desc">${escapeHtml(p.descricao)}</div>
                ${imagensExtra}
                ${links}
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="empty-state">Não foi possível carregar os projetos agora. Tente novamente mais tarde.</div>';
      }
    }

    carregarProjetos();
  </script>
</body>
</html>
