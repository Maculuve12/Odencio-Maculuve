<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicações — Odêncio Maculuve</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height: 100%; }

  body {
    background:#111214;
    font-family:'Poppins',sans-serif;
    min-height: 100dvh;
  }

  .card {
    width: 100%;
    min-height: 100dvh;
    background:#111214;
    padding: clamp(20px, 4vw, 55px) clamp(20px, 6vw, 70px);
    display:flex;
    flex-direction:column;
    position: relative;
  }

  /* Top bar */
  .header {
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    z-index:3;
    padding-bottom: clamp(24px, 4vh, 40px);
  }

  .logo {
    font-weight:700;
    letter-spacing:2px;
    font-size: clamp(13px, 1.4vw, 15px);
    color:#f2f2f2;
  }

  .logo-wrap { display:flex; align-items:center; gap:12px; text-decoration:none; }

  .avatar {
    display:none;
    width:36px; height:36px; border-radius:50%;
    object-fit:cover; object-position: center top;
    filter: grayscale(100%) contrast(1.05);
    border:1px solid #3a3b40;
  }

  .top-menu { display:flex; align-items:flex-start; }

  /* Hamburger menu */
  .menu-wrap { position: relative; display:flex; align-items:center; }

  .menu-toggle {
    display:flex; flex-direction:column; justify-content:center;
    gap:5px; width:22px; height:16px; background:none; border:none;
    cursor:pointer; padding:0;
  }

  .menu-toggle span {
    display:block; height:2px; width:100%; background:#cfd0d2;
    transition: transform .25s ease, opacity .2s ease, background .2s ease;
  }

  .menu-toggle:hover span { background:#ffffff; }

  .menu-wrap.open .menu-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .menu-wrap.open .menu-toggle span:nth-child(2) { opacity:0; }
  .menu-wrap.open .menu-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .menu-dropdown {
    position:absolute; top: calc(100% + 18px); right:0;
    background:#17181b; border:1px solid #2a2b2f; border-radius:6px;
    padding: 10px 0; min-width:170px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
    z-index: 50;
  }

  .menu-wrap.open .menu-dropdown { opacity:1; visibility:visible; transform: translateY(0); }

  .menu-dropdown a {
    display:block; padding: 10px 22px; font-size:13px; letter-spacing:0.5px;
    color:#c7c8ca; text-decoration:none; font-weight:500;
    transition: background .15s ease, color .15s ease;
  }

  .menu-dropdown a:hover { background:#232428; color:#ffffff; }
  .menu-dropdown a.active { color:#ffffff; background:#1e1f23; }

  /* Content */
  .content { flex:1; max-width: 720px; }

  .eyebrow {
    font-size:11px;
    letter-spacing:2px;
    color:#8b8c91;
    font-weight:600;
    margin-bottom: 10px;
  }

  .hello {
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size: clamp(34px, 5vw, 58px);
    color:#f5f5f5;
    line-height:1.05;
    margin-bottom: clamp(10px, 2vh, 16px);
  }

  .desc {
    font-size: clamp(12.5px, 1vw, 15px);
    line-height:1.8;
    color:#9fa0a4;
    max-width: 560px;
    font-weight:400;
    margin-bottom: clamp(32px, 5vh, 48px);
  }

  /* Feed de publicações */
  .posts-feed {
    display:flex;
    flex-direction:column;
    gap: clamp(24px, 3vw, 36px);
  }

  .post-card {
    background:#17181b;
    border:1px solid #2a2b2f;
    border-radius:10px;
    overflow:hidden;
  }

  .post-cover {
    width:100%;
    max-height: 340px;
    overflow:hidden;
    background:#1c1d20;
  }

  .post-cover img {
    width:100%;
    max-height: 340px;
    object-fit:cover;
    filter: grayscale(50%) contrast(1.05);
  }

  .post-body { padding: 20px 22px 24px; }

  .post-date {
    font-size:11px;
    letter-spacing:0.5px;
    color:#6f7075;
    margin-bottom: 8px;
  }

  .post-title {
    font-size: clamp(18px, 2vw, 22px);
    font-weight:700;
    color:#f2f2f2;
    margin-bottom: 10px;
  }

  .post-content {
    font-size:13px;
    line-height:1.85;
    color:#9fa0a4;
  }

  .post-content p { margin-bottom: 10px; }
  .post-content p:last-child { margin-bottom: 0; }

  .empty-state {
    color:#6f7075;
    font-size:13px;
    padding: 30px 0;
  }

  /* Footer */
  .footer {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-top: clamp(30px, 5vh, 48px);
    padding-bottom: clamp(4px, 1vh, 10px);
    z-index:2;
  }

  .footer-label {
    font-size:10px;
    letter-spacing:0.5px;
    color:#8b8c91;
    margin-bottom: 14px;
    font-weight:500;
  }

  .footer-icons { display:flex; gap:20px; color:#cfd0d2; font-size:17px; margin-bottom: 14px; }
  .footer-icons a { color:#cfd0d2; opacity:0.85; text-decoration:none; transition: opacity .2s, color .2s; }
  .footer-icons a:hover { opacity:1; color:#ffffff; }

  .footer-year { font-size:11px; letter-spacing:1px; color:#5f6065; font-weight:400; }

  @media (max-width: 760px) {
    .card { padding: 24px 24px; }
    .menu-dropdown { right:0; left:auto; }
    .avatar { display:block; }
  }

  @media (min-width: 1400px) {
    .card { padding-left: 6vw; padding-right: 6vw; }
  }
</style>

<body>

  <div class="card">
    <div class="header">
      <div class="top-menu">

            <span></span><span></span><span></span>

          <nav class="menu-dropdown" id="menuDropdown">

    <div class="content reveal">

      <div class="posts-feed" id="postsFeed">

        <a href="https://www.facebook.com/share/1DaBPRNUiL/" target="_blank" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.instagram.com/odenciofilomenabuqu?igsh=Nmowb2IyNWk4aXpl" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="site-extras.js"></script>
  <script>
    const menuWrap = document.getElementById('menuWrap');
    const menuToggle = document.getElementById('menuToggle');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menuWrap.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', (e) => {
      if (!menuWrap.contains(e.target)) {
        menuWrap.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.getElementById('footerYear').textContent = '© ' + new Date().getFullYear();

    // ---------- Ícones do rodapé, dinâmicos a partir do Supabase ----------
    const ICONES = {
      whatsapp: 'fa-brands fa-whatsapp',
      instagram: 'fa-brands fa-instagram',
      tiktok: 'fa-brands fa-tiktok',
      facebook: 'fa-brands fa-facebook',
      email: 'fa-solid fa-envelope'
    };
    const NOMES = {
      whatsapp: 'WhatsApp',
      instagram: 'Instagram',
      tiktok: 'TikTok',
      facebook: 'Facebook',
      email: 'E-mail'
    };

    async function carregarFooterIcons() {
      try {
        const { data, error } = await window.supabaseClient
          .from('contactos')
          .select('plataforma, valor, ordem')
          .eq('ativo', true)
          .order('ordem', { ascending: true });

        if (error) throw error;
        if (data && data.length > 0) {
          const wrap = document.getElementById('footerIcons');
          wrap.innerHTML = data.map(c => {
            const icone = ICONES[c.plataforma] || 'fa-solid fa-link';
            const nome = NOMES[c.plataforma] || c.plataforma;
            const href = c.plataforma === 'email' ? ('mailto:' + c.valor) : c.valor;
            return `<a href="${href}" target="_blank" title="${nome}"><i class="${icone}"></i></a>`;
          }).join('');
        }
      } catch (err) {
        console.warn('Não foi possível carregar contactos do Supabase, a mostrar ícones padrão.', err);
      }
    }
    carregarFooterIcons();

    // ---------- Publicações ----------
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function formatarData(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch { return ''; }
    }

    async function carregarPublicacoes() {
      const feed = document.getElementById('postsFeed');
      try {
        const { data, error } = await window.supabaseClient
          .from('publicacoes')
          .select('id, titulo, conteudo, imagem, criado_em')
          .eq('publicado', true)
          .order('criado_em', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          feed.innerHTML = '<div class="empty-state">Ainda não há publicações. Volte em breve.</div>';
          return;
        }

        feed.innerHTML = data.map(p => {
          const capa = p.imagem
            ? `<div class="post-cover"><img src="${escapeHtml(p.imagem)}" alt="${escapeHtml(p.titulo)}"></div>`
            : '';

          // conteúdo pode conter HTML simples (parágrafos) vindo do ADM
          const conteudoHtml = p.conteudo && p.conteudo.trim().startsWith('<')
            ? p.conteudo
            : `<p>${escapeHtml(p.conteudo)}</p>`;

          const urlPartilha = window.location.origin + window.location.pathname + '?post=' + p.id;

          return `
            <article class="post-card fade-in-item">
              ${capa}
              <div class="post-body">
                <div class="post-date">${formatarData(p.criado_em)}</div>
                <div class="post-title">${escapeHtml(p.titulo)}</div>
                <div class="post-content">${conteudoHtml}</div>
                <div class="share-row">
                  <button class="share-btn" title="Partilhar no WhatsApp" onclick="partilharWhatsApp('${escapeHtml(p.titulo)}', '${urlPartilha}')"><i class="fa-brands fa-whatsapp"></i></button>
                  <button class="share-btn" title="Copiar link" onclick="copiarLink('${urlPartilha}', this)"><i class="fa-solid fa-link"></i></button>
                </div>
              </div>
            </article>`;
        }).join('');
      } catch (err) {
        console.error(err);
        feed.innerHTML = '<div class="empty-state">Não foi possível carregar as publicações agora. Tente novamente mais tarde.</div>';
      }
    }

    carregarPublicacoes();
  
    initWhatsAppButton('https://wa.me/qr/DJSC2R2MUJ5AF1');
  </script>
</body>
