<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactos — Odêncio Maculuve</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height: 100%; }

  body {
    background:#111214;
    font-family:'Poppins',sans-serif;
    min-height: 100dvh;
  }

  .card {
    width: 100%;
    min-height: 100dvh;
    background:#111214;
    padding: clamp(20px, 4vw, 55px) clamp(20px, 6vw, 70px);
    display:grid;
    grid-template-columns: 1fr 1.05fr;
    grid-template-rows: auto 1fr auto;
    column-gap: clamp(20px, 3vw, 40px);
    position: relative;
  }

  /* Top bar */
  .header {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    z-index:3;
    padding-top: clamp(4px, 1vh, 10px);
    padding-bottom: clamp(20px, 3vh, 34px);
  }

  .logo {
    font-weight:700;
    letter-spacing:2px;
    font-size: clamp(13px, 1.4vw, 15px);
    color:#f2f2f2;
  }

  .logo-wrap {
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }

  .avatar {
    display:none;
    width:36px;
    height:36px;
    border-radius:50%;
    object-fit:cover;
    object-position: center top;
    filter: grayscale(100%) contrast(1.05);
    border:1px solid #3a3b40;
  }

  .top-menu { display:flex; align-items:flex-start; }

  /* Hamburger menu */
  .menu-wrap { position: relative; display:flex; align-items:center; }

  .menu-toggle {
    display:flex; flex-direction:column; justify-content:center;
    gap:5px; width:22px; height:16px; background:none; border:none;
    cursor:pointer; padding:0;
  }

  .menu-toggle span {
    display:block; height:2px; width:100%; background:#cfd0d2;
    transition: transform .25s ease, opacity .2s ease, background .2s ease;
  }

  .menu-toggle:hover span { background:#ffffff; }

  .menu-wrap.open .menu-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .menu-wrap.open .menu-toggle span:nth-child(2) { opacity:0; }
  .menu-wrap.open .menu-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .menu-dropdown {
    position:absolute; top: calc(100% + 18px); right:0;
    background:#17181b; border:1px solid #2a2b2f; border-radius:6px;
    padding: 10px 0; min-width:170px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
    z-index: 50;
  }

  .menu-wrap.open .menu-dropdown { opacity:1; visibility:visible; transform: translateY(0); }

  .menu-dropdown a {
    display:block; padding: 10px 22px; font-size:13px; letter-spacing:0.5px;
    color:#c7c8ca; text-decoration:none; font-weight:500;
    transition: background .15s ease, color .15s ease;
  }

  .menu-dropdown a:hover { background:#232428; color:#ffffff; }
  .menu-dropdown a.active { color:#ffffff; background:#1e1f23; }

  /* Middle content */
  .content {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-right: clamp(0px, 2vw, 30px);
    z-index:2;
    max-width: 640px;
  }

  .eyebrow {
    font-size:11px;
    letter-spacing:2px;
    color:#8b8c91;
    font-weight:600;
    margin-bottom: 10px;
  }

  .hello {
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size: clamp(34px, 5vw, 60px);
    color:#f5f5f5;
    line-height:1.05;
    margin-bottom: clamp(14px, 2vh, 22px);
  }

  .desc {
    font-size: clamp(12.5px, 1vw, 15px);
    line-height:1.9;
    color:#9fa0a4;
    max-width: 460px;
    font-weight:400;
    margin-bottom: clamp(28px, 4vh, 42px);
  }

  /* Social link grid — the actual clickable logos */
  .social-grid {
    display:grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 14px;
    max-width: 480px;
  }

  .social-card {
    display:flex;
    align-items:center;
    gap:14px;
    padding: 16px 18px;
    background:#17181b;
    border:1px solid #2a2b2f;
    border-radius:8px;
    text-decoration:none;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }

  .social-card:hover {
    background:#1e1f23;
    border-color:#3a3b40;
    transform: translateY(-2px);
  }

  .social-card i {
    font-size:20px;
    color:#e4e4e6;
    width:24px;
    text-align:center;
  }

  .social-card span {
    font-size:13.5px;
    color:#c7c8ca;
    font-weight:500;
  }

  /* Footer — apenas o ano, sem repetir os contactos */
  .footer {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top: clamp(14px, 3vh, 24px);
    padding-bottom: clamp(4px, 1vh, 10px);
    z-index:2;
  }

  .footer-year {
    font-size:11px;
    letter-spacing:1px;
    color:#5f6065;
    font-weight:400;
  }

  /* Right image */
  .portrait {
    grid-column: 2 / 3;
    grid-row: 1 / 4;
    position:relative;
    height: 100%;
    width: 100%;
    overflow:hidden;
  }

  .portrait img {
    position:absolute; inset:0; height:100%; width:100%;
    object-fit:cover; object-position: center top;
    filter: grayscale(100%) contrast(1.05);
    -webkit-mask-image: linear-gradient(to right, transparent, black 12%);
    mask-image: linear-gradient(to right, transparent, black 12%);
  }

  .dashnav {
    position:absolute; right: clamp(10px, 2vw, 30px); top:50%;
    transform: translateY(-50%); display:flex; flex-direction:column; gap:14px; z-index:2;
  }

  .dashnav span { width:26px; height:2px; background:#6a6c72; display:block; }
  .dashnav span:first-child { background:#e6e6e6; width:34px; }

  @media (max-width: 760px) {
    .card {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      padding: 24px 24px;
    }
    .portrait { display:none; }
    .content { grid-column: 1/2; padding-right:0; max-width:none; }
    .footer { grid-column: 1/2; grid-row: 3/4; }
    .menu-dropdown { right:0; left:auto; }
    .avatar { display:block; }
    .social-grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 1400px) {
    .card { padding-left: 6vw; padding-right: 6vw; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header">
      <a class="logo-wrap" href="index.html">
        <img class="avatar" src="avatar.png" alt="Odêncio Hermínio Maculuve">
        <div class="logo">MACULUVE</div>
      </a>
      <div class="top-menu">
        <div class="menu-wrap" id="menuWrap">
          <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <nav class="menu-dropdown" id="menuDropdown">
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre mim</a>
            <a href="contactos.html" class="active">Contactos</a>
            <a href="publicacoes.html">Publicações</a>
            <a href="projetos.html">Projetos</a>
            <a href="feedback.html">Feedback</a>
          </nav>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="eyebrow">CONTACTOS</div>
      <h1 class="hello">Vamos conversar</h1>
      <p class="desc">Escolha a rede da sua preferência para falar comigo diretamente.</p>

      <div class="social-grid" id="socialGrid">
        <a class="social-card" href="https://wa.me/qr/DJSC2R2MUJ5AF1" target="_blank" rel="noopener">
          <i class="fa-brands fa-whatsapp"></i>
          <span>WhatsApp</span>
        </a>
        <a class="social-card" href="https://www.instagram.com/odenciofilomenabuqu?igsh=Nmowb2IyNWk4aXpl" target="_blank" rel="noopener">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a class="social-card" href="https://www.tiktok.com/@odenciofilomenabu?_r=1&_t=ZS-98dtDX3Fg8a" target="_blank" rel="noopener">
          <i class="fa-brands fa-tiktok"></i>
          <span>TikTok</span>
        </a>
        <a class="social-card" href="https://www.facebook.com/share/1DaBPRNUiL/" target="_blank" rel="noopener">
          <i class="fa-brands fa-facebook"></i>
          <span>Facebook</span>
        </a>
      </div>
    </div>

    <div class="footer">
      <div class="footer-year" id="footerYear"></div>
    </div>

    <div class="portrait">
      <img src="man.png" alt="Odêncio Hermínio Maculuve">
      <div class="dashnav">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const menuWrap = document.getElementById('menuWrap');
    const menuToggle = document.getElementById('menuToggle');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menuWrap.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', (e) => {
      if (!menuWrap.contains(e.target)) {
        menuWrap.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.getElementById('footerYear').textContent = '© ' + new Date().getFullYear();

    // ---------- Ícones por plataforma ----------
    const ICONES = {
      whatsapp: 'fa-brands fa-whatsapp',
      instagram: 'fa-brands fa-instagram',
      tiktok: 'fa-brands fa-tiktok',
      facebook: 'fa-brands fa-facebook',
      email: 'fa-solid fa-envelope'
    };

    const NOMES = {
      whatsapp: 'WhatsApp',
      instagram: 'Instagram',
      tiktok: 'TikTok',
      facebook: 'Facebook',
      email: 'E-mail'
    };

    // Carrega os contactos dinamicamente do Supabase.
    // Se não houver dados (ou der erro), mantém os cartões fixos que já estão no HTML.
    async function carregarContactos() {
      try {
        const { data, error } = await window.supabaseClient
          .from('contactos')
          .select('plataforma, valor, ordem')
          .eq('ativo', true)
          .order('ordem', { ascending: true });

        if (error) throw error;
        if (data && data.length > 0) {
          const grid = document.getElementById('socialGrid');
          grid.innerHTML = data.map(c => {
            const icone = ICONES[c.plataforma] || 'fa-solid fa-link';
            const nome = NOMES[c.plataforma] || c.plataforma;
            const href = c.plataforma === 'email' ? ('mailto:' + c.valor) : c.valor;
            return `
              <a class="social-card" href="${href}" target="_blank" rel="noopener">
                <i class="${icone}"></i>
                <span>${nome}</span>
              </a>`;
          }).join('');
        }
      } catch (err) {
        console.warn('Não foi possível carregar contactos do Supabase, a mostrar contactos padrão.', err);
      }
    }

    carregarContactos();
  </script>
</body>
</html>
